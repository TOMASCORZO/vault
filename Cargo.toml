[workspace]
members = [
    "crates/vault-burn",
    "crates/vault-core",
    "crates/vault-privacy",
    "crates/vault-protocol",
    "crates/vault-signer",
    "crates/vault-sim",
    "crates/vault-wallet",
]
exclude = ["vendor/orchard", "zk/halo2", "zk/risc0"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"

[workspace.dependencies]
blake3 = "1.8.7"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ff = "0.13.1"
fs2 = "=0.4.3"
incrementalmerkletree = "=0.8.2"
libc = "=0.2.189"
orchard = { version = "=0.15.5", path = "vendor/orchard", default-features = false, features = ["std"] }
pasta_curves = "=0.5.2"
proptest = "1.11.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["process", "std"] }
shardtree = "=0.7.1"
snow = { version = "=0.10.0", default-features = false, features = ["use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
subtle = "2.6.1"
tempfile = "=3.27.0"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zcash_note_encryption = "=0.4.2"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
