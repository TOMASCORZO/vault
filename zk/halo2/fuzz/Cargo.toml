[package]
name = "vault-zk-halo2-fuzz"
description = "Coverage-guided malformed-input fuzz targets for Vault Halo2 boundaries"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
vault-privacy = { path = "../../../crates/vault-privacy" }
vault-protocol = { path = "../../../crates/vault-protocol" }
vault-signer = { path = "../../../crates/vault-signer" }
vault-zk-halo2-core = { path = "../core" }

[[bin]]
name = "composite_transfer_proof_decode"
path = "fuzz_targets/composite_transfer_proof_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signer_codec_decode"
path = "fuzz_targets/signer_codec_decode.rs"
test = false
doc = false
bench = false

# Keep fuzz-only nightly and sanitizer dependencies out of the pinned Halo2
# release workspace and its normal gates.
[workspace]
members = ["."]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
