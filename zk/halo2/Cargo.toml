[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1.8.7"
ff = "0.13.1"
halo2_proofs = { version = "=0.3.5", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort", "multicore"] }
halo2_gadgets = { version = "=0.5.0", default-features = false }
incrementalmerkletree = "=0.8.2"
orchard = { version = "=0.15.5", path = "../../vendor/orchard", default-features = false, features = ["std", "circuit", "multicore"] }
pasta_curves = "=0.5.2"
rand_core = "0.6.4"
sha2 = "0.10.9"
thiserror = "2.0.18"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
