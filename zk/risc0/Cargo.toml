[workspace]
members = ["core", "host", "methods"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
bincode = "1.3.3"
blake3 = { version = "1.8.7", default-features = false }
incrementalmerkletree = "=0.8.2"
orchard = { version = "=0.15.5", path = "../../vendor/orchard", default-features = false, features = ["std"] }
pasta_curves = "=0.5.2"
rand_chacha = "0.3.1"
risc0-build = { version = "=3.0.6", default-features = false }
risc0-zkvm = { version = "=3.0.6", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Upstream risc0-sys 1.5.0 builds Metal assets unconditionally on macOS. The
# vendored patch gates only those assets behind its existing `metal` feature;
# CPU circuit kernels remain enabled and receipts remain cryptographic.
[patch.crates-io]
risc0-sys = { path = "vendor/risc0-sys" }
risc0-zkp = { path = "vendor/risc0-zkp" }
