[package]
name = "vault-zk-transfer-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

# The guest is built by risc0-build and intentionally detached from its parent
# workspace so Cargo can compile it for the zkVM target independently.
[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }
vault-zk-transfer-core = { path = "../../core" }
